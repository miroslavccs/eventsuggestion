spring.application.name=eventsuggestion

# Database - PostgreSQL (run: docker-compose up -d db)
# DB_URL wins when set (local/Docker Compose); otherwise composed from DB_HOST/DB_PORT/DB_NAME (Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventsuggestion}}
spring.datasource.username=${DB_USERNAME:eventsuggestion}
spring.datasource.password=${DB_PASSWORD:eventsuggestion}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Virtual threads (Java 21 / Spring Boot 4)
spring.threads.virtual.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIGRldmVsb3BtZW50IHNlY3VyaXR5}
app.jwt.expiration-ms=86400000

# CORS (comma-separated origins allowed to call the API from a browser)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

# OpenAI-compatible LLM gateway (DreamPrompting - free, no credit card: https://dreamprompting.com/api-docs)
openai.api-key=${OPENAI_API_KEY:}
openai.model=auto
openai.base-url=https://dreamprompting.com/api/v1
openai.max-tokens=2000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.codecraft.eventsuggestion=INFO
logging.level.org.flywaydb=DEBUG
