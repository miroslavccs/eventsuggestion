spring.application.name=eventsuggestion

# Database - PostgreSQL (run: docker-compose up -d db)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventsuggestion}
spring.datasource.username=${DB_USERNAME:eventsuggestion}
spring.datasource.password=${DB_PASSWORD:eventsuggestion}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Virtual threads (Java 21 / Spring Boot 4)
spring.threads.virtual.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIGRldmVsb3BtZW50IHNlY3VyaXR5}
app.jwt.expiration-ms=86400000

# OpenAI
openai.api-key=${OPENAI_API_KEY:test}
openai.model=gpt-4o
openai.base-url=https://api.openai.com/v1
openai.max-tokens=2000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.codecraft.eventsuggestion=INFO
logging.level.org.flywaydb=DEBUG
