# Test profile — uses H2 with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:livelife;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway runs the same migration scripts against H2
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (test values)
app.jwt.secret=testSecretKeyForTestingPurposesOnly1234567890
app.jwt.expiration-ms=86400000

# OpenAI-compatible LLM gateway (disabled in tests — no real calls made)
openai.api-key=
openai.model=auto
openai.base-url=https://dreamprompting.com/api/v1
openai.max-tokens=2000